name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      - name: Ruff lint
        run: uv run ruff check src tests scripts benchmarks

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts benchmarks

      - name: Pyright strict
        run: uv run pyright src tests benchmarks

      - name: Changelog fragments
        run: uv run python scripts/build_changelog.py --check

      # -c pyproject.toml is required: bandit does not auto-discover
      # [tool.bandit] skips/exclude_dirs in this environment.
      - name: Bandit
        run: uv run bandit -q -r src -x tests -c pyproject.toml

      - name: pre-commit
        run: uv run pre-commit run --all-files

  tests:
    name: Tests & Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      # Runs the complete configured test suite (pyproject testpaths =
      # ["tests"]), including tests/test_packaging.py outside tests/parser,
      # and enforces both coverage gates: 100% line coverage after exclusions
      # and a minimum branch coverage. It also prints how many executable
      # lines the exclusion rules keep outside the line gate.
      - name: Run full suite and enforce line + branch coverage gates
        run: uv run python scripts/check_branch_coverage.py

      - name: Verify full-suite coverage file was produced
        run: test -s coverage.xml

  benchmarks:
    name: Parse Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      - name: Run benchmarks
        run: uv run pytest benchmarks --no-cov -q --benchmark-json=benchmark.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-json-${{ github.run_id }}
          path: benchmark.json

  fuzz:
    name: Deterministic Fuzz Regression + PR Fuzz Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      # Deterministic corpus regression: every corpus fixture must either parse
      # or produce an *expected* invalid-input error, and nothing may time out.
      # (Kept as a single line: YAML folded scalars with indented continuation
      # lines produce literal newlines that break python -c.)
      - name: Deterministic corpus regression
        run: >-
          uv run python -c "from sattline_parser.fuzz_harness import run_corpus_regression, assert_no_crashes, assert_no_timeouts; results = run_corpus_regression(); assert_no_crashes(results); assert_no_timeouts(results); print(f'corpus regression OK ({len(results)} files)')"

      # PR fuzz smoke: random input generation must not crash the parser.
      - name: Random fuzz smoke
        run: >-
          uv run python -c "from sattline_parser.fuzz_harness import run_random_fuzz, assert_no_crashes; results = run_random_fuzz(rounds=50); assert_no_crashes(results); print('random fuzz smoke OK')"

  security:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      # Audits the exact locked dependency set for known vulnerabilities.
      - name: pip-audit
        run: uv run pip-audit

  build-package:
    name: Build & Install Package Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      - name: Build wheel and sdist
        run: uv run python -m build

      - name: Check distribution metadata
        run: uv run python -m twine check dist/*

      - name: Install wheel into clean venv and run smoke test
        shell: bash
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/python scripts/smoke_installed.py

      - name: Install sdist into clean venv and run smoke test
        shell: bash
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet dist/*.tar.gz
          /tmp/sdist-venv/bin/python scripts/smoke_installed.py

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: pypi-dist-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  lark-compat:
    name: Lark Compatibility (latest <1.4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Resolves the *latest* lark matching the declared range (>=1.3.1,<1.4), in
      # addition to the locked version tested in the main tests job.
      - name: Install dev extras and upgrade lark to latest in range
        run: uv sync --all-extras --upgrade-package lark

      # --no-sync so uv does not revert lark to the locked version.
      - name: Run full test suite against latest lark
        run: uv run --no-sync python -m pytest

  windows:
    name: Windows Compatibility
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # atheris (the `fuzz` extra) is Linux/FreeBSD-only, so install the test
      # extra only here. The fuzz tests monkeypatch atheris and never import it.
      - name: Install locked test environment
        run: uv sync --frozen --extra test

      # Full suite on Windows: encodings, paths, and packaging are platform
      # sensitive, so the entire suite (including fuzz-worker subprocesses) runs.
      - name: Run full pytest suite
        run: uv run python -m pytest
