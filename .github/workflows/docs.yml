name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - ".opencode/**"
      - ".github/pull_request_template.md"
      - "opencode.json"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
      - ".github/mermaid-puppeteer.json"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - ".opencode/**"
      - ".github/pull_request_template.md"
      - "opencode.json"
      - "scripts/check_docs.py"
      - ".github/workflows/docs.yml"
      - ".github/mermaid-puppeteer.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    name: Links, prose, and Mermaid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Validate JSON configuration
        run: |
          python -m json.tool opencode.json >/dev/null
          python -m json.tool .github/mermaid-puppeteer.json >/dev/null

      - name: Check documentation links, prose, and Mermaid extraction
        run: python scripts/check_docs.py --mermaid-dir /tmp/sattline-mermaid

      - name: Render every Mermaid diagram
        shell: bash
        run: |
          set -euo pipefail
          for diagram in /tmp/sattline-mermaid/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@11.17.1 \
              -p .github/mermaid-puppeteer.json \
              -i "$diagram" \
              -o "${diagram%.mmd}.svg"
          done
