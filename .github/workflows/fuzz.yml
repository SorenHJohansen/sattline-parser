name: ClusterFuzzLite

# Long-running, coverage-guided fuzzing via ClusterFuzzLite. This is the
# continuous fuzzing tier and is deliberately separate from:
#   - deterministic corpus regression  -> normal CI (ci.yml, "fuzz" job)
#   - random-input PR fuzz smoke        -> normal CI (ci.yml, "fuzz" job)
# ClusterFuzzLite runs on a schedule and on merges to main, and maintains a
# regression corpus of previously-crashing inputs. It deliberately does NOT
# run on pull_request events: that would fuzz every push to a PR branch.
# PRs get cheap fuzz smoke coverage via ci.yml instead; ClusterFuzzLite only
# fires when a PR is merged (push to main) or via the schedule/manual runs.

on:
  schedule:
    - cron: "27 3 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzzing:
    name: Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          keep-unaffected-fuzz-targets: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-sarif: true
