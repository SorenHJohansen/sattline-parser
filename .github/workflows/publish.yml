name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected package version (e.g. 2026.8.1); checked against the package metadata"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Release Validation (tests, typing, lint, build, install, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      # A release may not publish a package whose internal version differs from
      # the git tag (or the explicitly supplied workflow_dispatch version).
      - name: Check tag/version consistency
        shell: bash
        run: |
          package_version="$(uv run python -c 'from sattline_parser import __version__; print(__version__)')"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected="${GITHUB_REF#refs/tags/v}"
          else
            expected="${{ inputs.version }}"
          fi
          if [[ -n "${expected}" && "${expected}" != "${package_version}" ]]; then
            echo "Version mismatch: tag/dispatch version '${expected}' != package version '${package_version}'"
            exit 1
          fi
          echo "Version consistency OK: ${package_version}"

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Pyright strict
        run: uv run pyright src tests

      - name: Full suite with line + branch coverage gates
        run: uv run python scripts/check_branch_coverage.py

      - name: Build wheel and sdist
        run: uv run python -m build

      - name: Check distribution metadata
        run: uv run python -m twine check dist/*

      - name: Install wheel into clean venv and run smoke test
        shell: bash
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/python scripts/smoke_installed.py

      - name: Install sdist into clean venv and run smoke test
        shell: bash
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet dist/*.tar.gz
          /tmp/sdist-venv/bin/python scripts/smoke_installed.py

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: pypi-dist-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pypi-dist-${{ github.run_id }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist
          skip-existing: true
