name: Publish

# Publication is only as safe as the gate in front of it. ``publish`` therefore
# depends on the full CI workflow for the same commit, called as a reusable
# workflow, rather than on a shorter copy of it: bandit, pip-audit, pre-commit,
# the changelog check, the Windows job, and the Lark compatibility job all have
# to pass before a tag can reach PyPI. Because the called jobs run in this run,
# at this run's commit, a tag can never be published from a commit CI did not
# evaluate.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected package version (e.g. 2026.8.1); checked against the package metadata"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  validate:
    name: Release Validation (version, artifacts)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      # The CI jobs above ran against one commit. Check the release job checks
      # out that same commit, so the version check and the built artifacts
      # describe exactly what CI validated.
      - name: Check the release commit is the CI commit
        shell: bash
        run: |
          head_sha="$(git rev-parse HEAD)"
          if [[ "${head_sha}" != "${{ github.sha }}" ]]; then
            echo "Checked-out commit ${head_sha} is not the triggered commit ${{ github.sha }}"
            exit 1
          fi
          echo "Release commit OK: ${head_sha}"

      # A tag with fragments still pending publishes release notes that mix two
      # versions: the pending entries describe code already shipped, and they
      # land in the next section. Assemble them before tagging.
      - name: Check no pending changelog fragments
        shell: bash
        run: |
          pending="$(git ls-files 'changelog.d/*.md' | grep -v '^changelog.d/README.md$' || true)"
          if [[ -n "${pending}" ]]; then
            echo "Pending changelog fragments must be released before tagging:"
            echo "${pending}"
            exit 1
          fi
          echo "No pending changelog fragments."

      # A release may not publish a package whose internal version differs from
      # the git tag (or the explicitly supplied workflow_dispatch version).
      - name: Check tag/version consistency
        shell: bash
        run: |
          package_version="$(uv run python -c 'from sattline_parser import __version__; print(__version__)')"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected="${GITHUB_REF#refs/tags/v}"
          else
            expected="${{ inputs.version }}"
          fi
          # workflow_dispatch requires inputs.version, and a tag push always
          # supplies one, so an empty value is a configuration bug, not a pass.
          if [[ -z "${expected}" ]]; then
            echo "No expected version: pass inputs.version or push a v* tag."
            exit 1
          fi
          if [[ "${expected}" != "${package_version}" ]]; then
            echo "Version mismatch: tag/dispatch version '${expected}' != package version '${package_version}'"
            exit 1
          fi
          echo "Version consistency OK: ${package_version}"

      # The artifacts are the ones the CI build job produced and installed into
      # a clean venv; this job only confirms their metadata before publishing.
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist-${{ github.run_id }}
          path: dist

      - name: Check distribution metadata
        run: uv run python -m twine check dist/*

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-dist-${{ github.run_id }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
