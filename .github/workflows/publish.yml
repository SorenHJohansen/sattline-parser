name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected package version (e.g. 2026.8.1); checked against the package metadata"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Release Validation (tests, typing, lint, build, install, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@0c5bed2c0c1c4f6e6f9b0a0f2c1e4d4f1a0f2c1 # v6

      - name: Install locked dev environment
        run: uv sync --frozen --all-extras

      # A release may not publish a package whose internal version differs from
      # the git tag (or the explicitly supplied workflow_dispatch version).
      - name: Check tag/version consistency
        shell: bash
        run: |
          package_version="$(uv run python -c 'from sattline_parser import __version__; print(__version__)')"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected="${GITHUB_REF#refs/tags/v}"
          else
            expected="${{ inputs.version }}"
          fi
          if [[ -n "${expected}" && "${expected}" != "${package_version}" ]]; then
            echo "Version mismatch: tag/dispatch version '${expected}' != package version '${package_version}'"
            exit 1
          fi
          echo "Version consistency OK: ${package_version}"

      - name: Ruff lint
        run: uv run ruff check src tests scripts

      - name: Ruff format check
        run: uv run ruff format --check src tests scripts

      - name: Pyright strict
        run: uv run pyright src tests

      - name: Full test suite with coverage
        run: uv run python -m pytest

      - name: Build wheel and sdist
        run: uv run python -m build

      - name: Check distribution metadata
        run: uv run python -m twine check dist/*

      - name: Install wheel into clean venv and run smoke test
        shell: bash
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/python scripts/smoke_installed.py

      - name: Install sdist into clean venv and run smoke test
        shell: bash
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet dist/*.tar.gz
          /tmp/sdist-venv/bin/python scripts/smoke_installed.py

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: pypi-dist-${{ github.run_id }}
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-dist-${{ github.run_id }}
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          packages-dir: dist
          skip-existing: true
